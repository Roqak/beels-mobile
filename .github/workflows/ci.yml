name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.3
          channel: stable
          cache: true

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Assemble debug APK (smoke build)
        # Release builds fail fast without the (local-only) release
        # keystore; CI smoke-builds the debug variant instead.
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beels-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error