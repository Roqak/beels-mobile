name: beels_mobile
description: Beels — digital ajo/esusu group savings.
publish_to: 'none'
version: 0.14.0+15

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.3
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  local_auth: ^2.2.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Brand fonts bundled so text renders offline (google_fonts uses these
  # assets before falling back to a runtime download).
  assets:
    - assets/google_fonts/